# Hardware model IDs in prose use lowercase (matches lesson metadata: n150, n300, …).
# Uppercase variants in sentences are normalized to lowercase for consistency.
extends: substitution
message: "Hardware model IDs should be lowercase in prose: use '%s' instead of '%s'."
level: error
ignorecase: false
action:
  name: replace
swap:
  '\bN150\b': n150
  '\bN300\b': n300
  '\bT3K\b': T3000
  '\bP100\b': p100
  '\bP150\b': p150
  '\bP300\b': p300
  '\bP300c\b': p300c
  '\bP300C\b': p300c
  '\bGalaxy\b': galaxy
  # Company name
  '\btenstorrent\b': Tenstorrent
