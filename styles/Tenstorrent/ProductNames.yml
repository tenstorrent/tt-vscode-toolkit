# Hardware model IDs in prose use lowercase (matches lesson metadata: n150, n300, …).
# Uppercase variants in sentences are normalized. Exception: T3K → T3000 (product name, not a slug).
# Note: front matter id: fields (e.g. id: tt-installer) may trigger Terminology.yml rules — known
# limitation of Vale's TokenIgnores; treat those as accepted noise (slugs are not prose).
extends: substitution
message: "Hardware model IDs should be lowercase in prose (exception: T3000 is the product name): use '%s' instead of '%s'."
level: error
ignorecase: false
action:
  name: replace
swap:
  '\bN150\b': n150
  '\bN300\b': n300
  '\bT3K\b': T3000
  '\bP100\b': p100
  '\bP150\b': p150
  '\bP300\b': p300
  '\bP300c\b': p300c
  '\bP300C\b': p300c
  # Company name
  '\btenstorrent\b': Tenstorrent
