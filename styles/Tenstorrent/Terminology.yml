# Catches misspelled or inconsistently-cased product names in prose.
# Code blocks and inline code are excluded from Vale's text scope by default.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
action:
  name: replace
swap:
  # vLLM — camelCase with lowercase v
  '(?i)\bVLLM\b': vLLM
  '\bvllm\b': vLLM
  '\bVllm\b': vLLM
  # TT-Metalium — platform name in prose (paths/URLs stay tt-metal)
  'TT Metal(?!ium)': TT-Metalium
  '\bTTMetal\b': TT-Metalium
  '\bTT-Metal\b': TT-Metalium
  '\btt metal\b': TT-Metalium
  '\btt-metal\b': TT-Metalium
  # TT-Metalium — must keep full name
  '\bTT Metalium\b': TT-Metalium
  '\bTTMetalium\b': TT-Metalium
  # tt-lang → TT-Lang in prose
  '\bTTLang\b': TT-Lang
  '\btt lang\b': TT-Lang
  '\btt-lang\b': TT-Lang
  # tt-xla → TT-XLA in prose
  'TT XLA': TT-XLA
  '\bTTXLA\b': TT-XLA
  '\btt-xla\b': TT-XLA
  # tt-forge → TT-Forge in prose
  'TT Forge(?!-fe)': TT-Forge
  '\bTTForge\b': TT-Forge
  '\btt-forge\b(?!-fe|-models)': TT-Forge
  # TT-VSCode-Toolkit
  '\btt-vscode-toolkit\b': TT-VSCode-Toolkit
  'TT Developer Toolkit': TT-VSCode-Toolkit
  'Tenstorrent VSCode Toolkit': TT-VSCode-Toolkit
  # TT-Installer
  '\btt-installer\b': TT-Installer
  '\btt_installer\b': TT-Installer
  # TT-Inference-Server
  '\btt_inference_server\b': TT-Inference-Server
  '\btt-inference-server\b': TT-Inference-Server
  'TTInferenceServer': TT-Inference-Server
  # CLI tools
  '\bTTSMI\b': tt-smi
  '\btt_smi\b': tt-smi
